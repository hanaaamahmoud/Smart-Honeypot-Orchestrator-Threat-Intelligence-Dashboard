services:

  dionaea-init:
    image: alpine:latest
    container_name: dionaea-init
    command: >
      sh -c " mkdir -p /data && chmod -R 777 /data "
    volumes:
      - ./data:/data

  dionaea:
    image: ghcr.io/telekom-security/dionaea:24.04.1
    container_name: dionaea
    mem_limit: 512m
    restart: unless-stopped

    depends_on:
      dionaea-init:
        condition: service_completed_successfully

    ports:
      - "21:21"

    volumes:
      - ../../../elk/logs/doinaea:/opt/dionaea/var/log
