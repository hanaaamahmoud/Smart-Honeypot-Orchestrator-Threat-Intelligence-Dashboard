services:

  dionaea-init:
    image: alpine:latest
    container_name: dionaea-init

    command: >
      sh -c "
      mkdir -p /data/binaries &&
      mkdir -p /data/roots/ftp &&
      mkdir -p /data/roots/tftp &&
      mkdir -p /data/roots/www &&
      mkdir -p /data/bistreams &&
      mkdir -p /data/log &&
      chmod -R 777 /data
      "

    volumes:
      - ./data:/data


  dionaea:
    image: ghcr.io/telekom-security/dionaea:24.04.1
    container_name: dionaea
    restart: always

    depends_on:
      dionaea-init:
        condition: service_completed_successfully

    ports:
      - "21:21"

    volumes:
      - ./data:/opt/dionaea/var/dionaea
      - ./data/log:/opt/dionaea/var/log
