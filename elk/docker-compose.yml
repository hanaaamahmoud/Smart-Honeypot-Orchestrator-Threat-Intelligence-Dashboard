services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - elk-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.2
    container_name: logstash
    depends_on:
      - elasticsearch
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - logstashdata:/usr/share/logstash/data
      - ../honeypots/docker/cowrie/data/log:/mnt/logs/cowrie:ro
      - ../honeypots/docker/dionaea/data/log:/mnt/logs/dionaea:ro
      - ../honeypots/docker/tanner/data/log:/mnt/logs/tanner:ro
    restart: unless-stopped
    networks:
      - elk-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.19.2
    container_name: kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - XPACK_SECURITY_ENABLED=false
    depends_on:
      - elasticsearch
    networks:
      - elk-net

networks:
  elk-net:
    driver: bridge

volumes:
  esdata:
  logstashdata:
