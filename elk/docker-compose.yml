
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
    restart: unless-stopped
    networks:
      - elk-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.19.2
    container_name: logstash
    depends_on:
      - elasticsearch
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline
      - ./logstash/data:/usr/share/logstash/data
      - /home/bushi/projects/Smart-Honeypot-Orchestrator-Threat-Intelligence-Dashboard/honeypots/docker/cowrie/data/log:/mnt/logs/cowrie:ro
      - /home/bushi/projects/Smart-Honeypot-Orchestrator-Threat-Intelligence-Dashboard/honeypots/docker/dionaea/data/log:/mnt/logs/dionaea:ro
      - /home/bushi/tpotce/data/tanner/log:/mnt/logs/tanner:ro
    restart: unless-stopped
    networks:
      - elk-net

networks:
  elk-net:
    driver: bridge
