input {

  file {
    id => "cowrie-json"
    path => "/mnt/logs/cowrie/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "tail"

    codec => json {
      ecs_compatibility => "disabled"
      target => "[raw]"
    }

    add_field => {
      "[meta][honeypot]" => "cowrie"
      "[meta][source_dataset]" => "live_cowrie"
    }
  }


  file {
    id => "dionaea-json"
    path => "/mnt/logs/dionaea/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "tail"

    codec => json {
      ecs_compatibility => "disabled"
      target => "[raw]"
    }

    add_field => {
      "[meta][honeypot]" => "dionaea"
      "[meta][source_dataset]" => "live_dionaea"
    }
  }


  file {
    id => "tanner-json"
    path => "/mnt/logs/tanner/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "tail"

    codec => json {
      ecs_compatibility => "disabled"
      target => "[raw]"
    }

    add_field => {
      "[meta][honeypot]" => "tanner"
      "[meta][source_dataset]" => "live_tanner"
    }
  }

}


filter {

  ruby {
    id => "build-unified-schema"

    code => '

      raw = event.get("[raw]") || {}
      honeypot = event.get("[meta][honeypot]")
      dataset = event.get("[meta][source_dataset]")

      first = lambda do |value|
        if value.is_a?(Array)
          value.flatten.compact.first
        else
          value
        end
      end

      clean_string = lambda do |value|
        value = first.call(value)

        if value.nil?
          nil
        else
          value = value.to_s.strip
          value == "" ? nil : value
        end
      end

      integer = lambda do |value|
        value = first.call(value)

        begin
          if value.nil? || value.to_s.strip == ""
            nil
          else
            value.to_i
          end
        rescue
          nil
        end
      end


      #
      # SOURCE IP
      #

      source_ip = clean_string.call(raw["source_ip"])

      source_ip = clean_string.call(raw["src_ip"]) if source_ip.nil?

      if source_ip.nil?
        peer = raw["peer"]

        if peer.is_a?(Hash)
          source_ip = clean_string.call(peer["ip"])
        end
      end


      #
      # SOURCE PORT
      #

      source_port = integer.call(raw["source_port"])

      source_port = integer.call(raw["src_port"]) if source_port.nil?


      if source_port.nil?
        peer = raw["peer"]

        if peer.is_a?(Hash)
          source_port = integer.call(peer["port"])
        end
      end


      #
      # DESTINATION IP
      #

      destination_ip = clean_string.call(raw["destination_ip"])

      destination_ip = clean_string.call(raw["dst_ip"]) if destination_ip.nil?


      #
      # DESTINATION PORT
      #

      destination_port = integer.call(raw["destination_port"])

      destination_port = integer.call(raw["dst_port"]) if destination_port.nil?


      #
      # SESSION ID
      #

      session_id = clean_string.call(raw["session_id"])

      session_id = clean_string.call(raw["session"]) if session_id.nil?


      #
      # USERNAME
      #

      username = clean_string.call(raw["username"])

      if username.nil?
        credentials = raw["credentials"]

        if credentials.is_a?(Hash)
          username = clean_string.call(credentials["username"])
        end
      end


      #
      # PASSWORD
      #

      password = clean_string.call(raw["password"])

      if password.nil?
        credentials = raw["credentials"]

        if credentials.is_a?(Hash)
          password = clean_string.call(credentials["password"])
        end
      end


      #
      # PROTOCOL
      #

      protocol = clean_string.call(raw["protocol"])

      if protocol.nil?
        connection = raw["connection"]

        if connection.is_a?(Hash)
          protocol = clean_string.call(connection["protocol"])
        end
      end

      protocol = protocol.downcase if protocol


      #
      # TIMESTAMP
      #

      timestamp = clean_string.call(raw["timestamp"])

      if timestamp.nil?
        timestamp = event.get("@timestamp").to_s
      end


      #
      # COUNTERS
      #

      user_attempt = integer.call(raw["user_attempt"])
      pass_attempt = integer.call(raw["pass_attempt"])
      auth_attempt = integer.call(raw["auth_attempt"])
      anonymous = integer.call(raw["anonymous"])
      command_count = integer.call(raw["command_count"])


      #
      # COUNTRY / COUNTRY CODE
      #

      country = clean_string.call(raw["country"])
      country_code = clean_string.call(raw["country_code"])


      #
      # ATTACK INFORMATION
      #

      attack_type = clean_string.call(raw["attack_type"])
      mitre_technique = clean_string.call(raw["mitre_technique"])
      attack_stage = clean_string.call(raw["attack_stage"])
      severity = clean_string.call(raw["severity"])
      ip_reputation = clean_string.call(raw["ip_reputation"])


      #
      # PRIVATE IP DETECTION
      #

      if source_ip

        private_ip =
          source_ip.start_with?("10.") ||
          source_ip.start_with?("192.168.") ||
          source_ip.start_with?("172.16.") ||
          source_ip.start_with?("172.17.") ||
          source_ip.start_with?("172.18.") ||
          source_ip.start_with?("172.19.") ||
          source_ip.start_with?("172.20.") ||
          source_ip.start_with?("172.21.") ||
          source_ip.start_with?("172.22.") ||
          source_ip.start_with?("172.23.") ||
          source_ip.start_with?("172.24.") ||
          source_ip.start_with?("172.25.") ||
          source_ip.start_with?("172.26.") ||
          source_ip.start_with?("172.27.") ||
          source_ip.start_with?("172.28.") ||
          source_ip.start_with?("172.29.") ||
          source_ip.start_with?("172.30.") ||
          source_ip.start_with?("172.31.")

        if private_ip && ip_reputation.nil?
          ip_reputation = "private"
        end

      end


      #
      # CREATE TEMPORARY NORMALIZED OBJECT
      #

      event.set("[norm]", {

        "timestamp" => timestamp,

        "honeypot" => honeypot,

        "protocol" => protocol,

        "source_ip" => source_ip,

        "source_port" => source_port,

        "destination_ip" => destination_ip,

        "destination_port" => destination_port,

        "session_id" => session_id,

        "username" => username,

        "password" => password,

        "user_attempt" => user_attempt,

        "pass_attempt" => pass_attempt,

        "auth_attempt" => auth_attempt,

        "anonymous" => anonymous,

        "command_count" => command_count,

        "country" => country,

        "country_code" => country_code,

        "asn" => nil,

        "ip_reputation" => ip_reputation,

        "attack_type" => attack_type,

        "mitre_technique" => mitre_technique,

        "attack_stage" => attack_stage,

        "severity" => severity,

        "source_dataset" => dataset

      })

    '
  }


  #
  # CANONICAL TIMESTAMP
  #

  date {
    id => "parse-timestamp"
    match => [ "[norm][timestamp]", "ISO8601" ]
    target => "[norm][timestamp]"
  }


  #
  # GEOIP CITY + ASN
  #

  if [norm][source_ip] and [norm][ip_reputation] != "private" {

    geoip {

      id => "geoip-city"

      source => "[norm][source_ip]"
      target => "geo_city"
      database => "/usr/share/logstash/vendor/bundle/jruby/3.1.0/gems/logstash-filter-geoip-7.3.1-java/vendor/GeoLite2-City.mmdb"
      ecs_compatibility => "disabled"
    }

    geoip {

      id => "geoip-asn"

      source => "[norm][source_ip]"
      target => "geo_asn"
      database => "/usr/share/logstash/vendor/bundle/jruby/3.1.0/gems/logstash-filter-geoip-7.3.1-java/vendor/GeoLite2-ASN.mmdb"
      default_database_type => "ASN"
      ecs_compatibility => "disabled"
    }

  }


  #
  # COPY GEOIP VALUES INTO UNIFIED FIELDS
  #

  ruby {

    id => "apply-geoip"

    code => '

      country = event.get("[norm][country]")
      country_code = event.get("[norm][country_code]")
      asn = event.get("[norm][asn]")
      
      if country.nil? || country.to_s == ""

        country = event.get("[geo_city][country_name]")

      end


      #
      # COUNTRY CODE
      #


      if country_code.nil? || country_code.to_s == ""

        country_code = event.get("[geo_city][country_code2]")

      end

      if asn.nil? || asn.to_s == ""
        asn = event.get("[geo_asn][asn]")
      end

      if asn.nil? || asn.to_s == ""
        asn = event.get("[geo_asn][autonomous_system_number]")

      end

      
      if event.get("[norm][ip_reputation]") == "private"

        country = "Local" if country.nil? || country.to_s == ""

        country_code = "LOCAL" if country_code.nil? || country_code.to_s == ""

      end


      #
      # SET VALUES
      #


      event.set("[norm][country]", country)

      event.set("[norm][country_code]", country_code)


      begin

        if asn.nil? || asn.to_s == ""

          event.set("[norm][asn]", nil)

        else

          event.set("[norm][asn]", asn.to_i)

        end

      rescue

        event.set("[norm][asn]", nil)

      end
      
    '

  }


  #
  # FINAL STRICT UNIFIED SCHEMA
  #

  # Exactly 24 top-level fields.
  # No raw.
  # No norm.
  # No geo_city.
  # No geo_asn.
  # No meta.
  #

  ruby {

    id => "strict-unified-24"

    code => '

      n = event.get("[norm]") || {}


      fields = [

        "timestamp",
        "honeypot",
        "protocol",
        "source_ip",
        "source_port",
        "destination_ip",
        "destination_port",
        "session_id",
        "username",
        "password",
        "user_attempt",
        "pass_attempt",
        "auth_attempt",
        "anonymous",
        "command_count",
        "country",
        "country_code",
        "asn",
        "ip_reputation",
        "attack_type",
        "mitre_technique",
        "attack_stage",
        "severity",
        "source_dataset"

      ]


      #
      # REMOVE EVERYTHING
      #


      event.to_hash.keys.each do |key|

        event.remove(key)

      end


      #
      # REMOVE EVERYTHING
      #


      fields.each do |field|

        event.set(field, n[field])

      end

    '

  }


  #
  # FINAL DATA TYPES
  #

  mutate {

    convert => {

      "source_port" => "integer"

      "destination_port" => "integer"

      "user_attempt" => "integer"

      "pass_attempt" => "integer"

      "auth_attempt" => "integer"

      "anonymous" => "integer"

      "command_count" => "integer"

      "asn" => "integer"
      
      "timestamp" => "string"

    }

  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

}


output {

  elasticsearch {

    id => "honeypot-events"
    hosts => [ "http://elasticsearch:9200" ]
    index => "honeypot-events"

  }
}