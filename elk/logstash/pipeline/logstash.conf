input {

  file {
    id => "cowrie-json"
    path => "/mnt/logs/cowrie/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "tail"

    codec => json {
      ecs_compatibility => "disabled"
      target => "[raw]"
    }


    add_field => {
      "[meta][honeypot]" => "cowrie"
      "[meta][source_dataset]" => "live_cowrie"
    }
  }


  file {
    id => "dionaea-json"
    path => "/mnt/logs/dionaea/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "tail"

    codec => json {
      ecs_compatibility => "disabled"
      target => "[raw]"
    }

    add_field => {
      "[meta][honeypot]" => "dionaea"
      "[meta][source_dataset]" => "live_dionaea"
    }
  }


  file {
    id => "tanner-json"
    path => "/mnt/logs/tanner/*.json"
    start_position => "beginning"
    sincedb_path => "/dev/null"
    mode => "tail"

    codec => json {
      ecs_compatibility => "disabled"
      target => "[raw]"
    }

    add_field => {
      "[meta][honeypot]" => "tanner"
      "[meta][source_dataset]" => "live_tanner"
    }
  }

}


filter {

  ruby {
    id => "build-unified-schema"

    code => '

      raw = event.get("[raw]") || {}
      honeypot = event.get("[meta][honeypot]")
      dataset = event.get("[meta][source_dataset]")

      first = lambda do |value|
        if value.is_a?(Array)
          value.flatten.compact.first
        else
          value
        end
      end

      clean_string = lambda do |value|
        value = first.call(value)

        if value.nil?
          nil
        else
          value = value.to_s.strip
          value == "" ? nil : value
        end
      end

      integer = lambda do |value|
        value = first.call(value)

        begin
          if value.nil? || value.to_s.strip == ""
            nil
          else
            value.to_i
          end
        rescue
          nil
        end
      end


      #
      # SOURCE IP
      #

      source_ip = clean_string.call(raw["source_ip"])

      source_ip = clean_string.call(raw["src_ip"]) if source_ip.nil?

      if source_ip.nil?
        peer = raw["peer"]

        if peer.is_a?(Hash)
          source_ip = clean_string.call(peer["ip"])
        end
      end


      #
      # SOURCE PORT
      #

      source_port = integer.call(raw["source_port"])

      source_port = integer.call(raw["src_port"]) if source_port.nil?


      if source_port.nil?
        peer = raw["peer"]

        if peer.is_a?(Hash)
          source_port = integer.call(peer["port"])
        end
      end


      #
      # DESTINATION IP
      #

      destination_ip = clean_string.call(raw["destination_ip"])

      destination_ip = clean_string.call(raw["dst_ip"]) if destination_ip.nil?


      #
      # DESTINATION PORT
      #

      destination_port = integer.call(raw["destination_port"])

      destination_port = integer.call(raw["dst_port"]) if destination_port.nil?


      #
      # SESSION ID
      #

      session_id = clean_string.call(raw["session_id"])

      session_id = clean_string.call(raw["session"]) if session_id.nil?


      #
      # USERNAME
      #

      username = clean_string.call(raw["username"])

      if username.nil?
        credentials = raw["credentials"]

        if credentials.is_a?(Hash)
          username = clean_string.call(credentials["username"])
        end
      end


      #
      # PASSWORD
      #

      password = clean_string.call(raw["password"])

      if password.nil?
        credentials = raw["credentials"]

        if credentials.is_a?(Hash)
          password = clean_string.call(credentials["password"])
        end
      end


      #
      # PROTOCOL
      #

      protocol = clean_string.call(raw["protocol"])

      if protocol.nil?
        connection = raw["connection"]

        if connection.is_a?(Hash)
          protocol = clean_string.call(connection["protocol"])
        end
      end

      protocol = protocol.downcase if protocol


      #
      # TIMESTAMP
      #

      timestamp = clean_string.call(raw["timestamp"])

      if timestamp.nil?
        timestamp = event.get("@timestamp").to_s
      end


      #
      # COUNTERS
      #

      user_attempt = integer.call(raw["user_attempt"])
      pass_attempt = integer.call(raw["pass_attempt"])
      auth_attempt = integer.call(raw["auth_attempt"])
      anonymous = integer.call(raw["anonymous"])
      command_count = integer.call(raw["command_count"])


      #
      # COUNTRY / COUNTRY CODE
      #

      country = clean_string.call(raw["country"])
      country_code = clean_string.call(raw["country_code"])


      #
      # ATTACK INFORMATION
      #

      attack_type = clean_string.call(raw["attack_type"])
      mitre_technique = clean_string.call(raw["mitre_technique"])
      attack_stage = clean_string.call(raw["attack_stage"])
      severity = clean_string.call(raw["severity"])
      ip_reputation = clean_string.call(raw["ip_reputation"])
      ip_reputation_score = raw["ip_reputation_score"]
      ip_reputation_level = clean_string.call(raw["ip_reputation_level"])


      #
      # PRIVATE IP DETECTION
      #

      if source_ip

        private_ip =
          source_ip.start_with?("10.") ||
          source_ip.start_with?("192.168.") ||
          source_ip.start_with?("172.16.") ||
          source_ip.start_with?("172.17.") ||
          source_ip.start_with?("172.18.") ||
          source_ip.start_with?("172.19.") ||
          source_ip.start_with?("172.20.") ||
          source_ip.start_with?("172.21.") ||
          source_ip.start_with?("172.22.") ||
          source_ip.start_with?("172.23.") ||
          source_ip.start_with?("172.24.") ||
          source_ip.start_with?("172.25.") ||
          source_ip.start_with?("172.26.") ||
          source_ip.start_with?("172.27.") ||
          source_ip.start_with?("172.28.") ||
          source_ip.start_with?("172.29.") ||
          source_ip.start_with?("172.30.") ||
          source_ip.start_with?("172.31.")

        if private_ip && ip_reputation.nil?
          ip_reputation = "private"
        end

      end
      #
      # CREATE TEMPORARY NORMALIZED OBJECT
      event.set("[norm]", {

        "timestamp" => timestamp,

        "honeypot" => honeypot,

        "protocol" => protocol,

        "source_ip" => source_ip,

        "source_port" => source_port,

        "destination_ip" => destination_ip,

        "destination_port" => destination_port,

        "session_id" => session_id,

        "username" => username,

        "password" => password,

        "user_attempt" => user_attempt,

        "pass_attempt" => pass_attempt,

        "auth_attempt" => auth_attempt,

        "anonymous" => anonymous,

        "command_count" => command_count,

        "country" => country,

        "country_code" => country_code,

        "asn" => nil,

        "ip_reputation" => ip_reputation,
        "ip_reputation_score" => ip_reputation_score,
        "ip_reputation_level" => ip_reputation_level,

        "attack_type" => attack_type,

        "mitre_technique" => mitre_technique,

        "attack_stage" => attack_stage,

        "severity" => severity,

        "source_dataset" => dataset

      })

    '
  }


  #
  # CANONICAL TIMESTAMP
  #

  date {
    id => "parse-timestamp"
    match => [ "[norm][timestamp]", "ISO8601" ]
    target => "[norm][timestamp]"
  }


  #
  # GEOIP CITY + ASN
  #

  if [norm][source_ip] and [norm][ip_reputation] != "private" {

    geoip {

      id => "geoip-city"

      source => "[norm][source_ip]"
      target => "geo_city"
      database => "/usr/share/logstash/vendor/bundle/jruby/3.1.0/gems/logstash-filter-geoip-7.3.1-java/vendor/GeoLite2-City.mmdb"
      ecs_compatibility => "disabled"
    }

    geoip {

      id => "geoip-asn"

      source => "[norm][source_ip]"
      target => "geo_asn"
      database => "/usr/share/logstash/vendor/bundle/jruby/3.1.0/gems/logstash-filter-geoip-7.3.1-java/vendor/GeoLite2-ASN.mmdb"
      default_database_type => "ASN"
      ecs_compatibility => "disabled"
    }

  }


  #
  # COPY GEOIP VALUES INTO UNIFIED FIELDS
  #

  ruby {

    id => "apply-geoip"

    code => '

      country = event.get("[norm][country]")
      country_code = event.get("[norm][country_code]")
      asn = event.get("[norm][asn]")

      if country.nil? || country.to_s == ""

        country = event.get("[geo_city][country_name]")

      end


      #
      # COUNTRY CODE
      #


      if country_code.nil? || country_code.to_s == ""

        country_code = event.get("[geo_city][country_code2]")

      end

      if asn.nil? || asn.to_s == ""
        asn = event.get("[geo_asn][asn]")
      end

      if asn.nil? || asn.to_s == ""
        asn = event.get("[geo_asn][autonomous_system_number]")

      end


      if event.get("[norm][ip_reputation]") == "private"

        country = "Local" if country.nil? || country.to_s == ""

        country_code = "LOCAL" if country_code.nil? || country_code.to_s == ""

      end


      #
      # SET VALUES
      #


      event.set("[norm][country]", country)

      event.set("[norm][country_code]", country_code)


      begin

        if asn.nil? || asn.to_s == ""

          event.set("[norm][asn]", nil)

        else

          event.set("[norm][asn]", asn.to_i)

        end

      rescue

        event.set("[norm][asn]", nil)

      end

    '

  }


  #
  # MITRE ATT&CK ENRICHMENT (guide-aligned, using fields available in the event)
  ruby {
    id => "mitre-enrichment-guide-aligned"
    code => '
      n = event.get("[norm]") || {}
      raw = event.get("[raw]") || {}

      # Read command text only if a honeypot event supplies it.
      command = raw["command"] || raw["input"] || raw["cmd"] || raw["command_line"]
      command = command.to_s.downcase.strip unless command.nil?
      reputation = (n["ip_reputation"] || "").to_s.downcase.strip
      protocol = (n["protocol"] || "").to_s.downcase.strip
      honeypot = (n["honeypot"] || "").to_s.downcase.strip
      auth_attempt = (n["auth_attempt"] || 0).to_s.to_i
      command_count = (n["command_count"] || 0).to_s.to_i

      technique = nil
      attack_type = nil
      stage = nil
      severity = nil

      # 1) Reputation rules from the team guide have priority.
      if reputation.include?("tor exit node")
        technique = "T1090"
        attack_type = "C2 Activity"
        stage = "Command and Control"
        severity = "Critical"
      elsif reputation.include?("compromised")
        technique = "T1078"
        attack_type = "Compromised Host"
        stage = "Defense Evasion"
        severity = "High"
      elsif reputation.include?("mass scanner")
        technique = "T1046"
        attack_type = "Network Scanning"
        stage = "Discovery"
        severity = "Medium"
      else
        # 2) The 13 command-dictionary techniques from the guide.
        # Order is deliberate: specific patterns precede broad shell patterns.
        if !command.nil? && command != ""
          if command.match?(/\b(wget|curl|tftp|scp)\b/)
            technique = "T1105"
          elsif command.match?(/\b(cat\s+\/etc\/passwd|net\s+user)\b/)
            technique = "T1087"
          elsif command.match?(/\b(cat\s+\/etc\/shadow|mimikatz)\b/)
            technique = "T1003"
          elsif command.include?("authorized_keys")
            technique = "T1098"
          elsif command.match?(/\b(crontab|systemctl)\b/)
            technique = "T1053"
          elsif command.match?(/\b(rm\s+-rf|shred)\b/)
            technique = "T1070"
          elsif command.match?(/\b(nmap|masscan)\b/)
            technique = "T1046"
          elsif command.match?(/\b(uname|hostname)\b|\/proc\/version/)
            technique = "T1082"
          elsif command.match?(/\b(whoami|id|who)\b/)
            technique = "T1033"
          elsif command.match?(/\b(ls|dir|find)\b/)
            technique = "T1083"
          elsif command.match?(/\b(cat|head|tail)\b/)
            technique = "T1005"
          elsif command.match?(/\b(ssh|telnet)\b/)
            technique = "T1021"
          elsif command.match?(/\b(bash|sh|python)\b/)
            technique = "T1059"
          end

          if technique
            attack_type = "Post-Exploitation"
            stage = "Execution"
            severity = "High"
          end
        end

        # 3) Protocol/behavior rules from the guide if no command rule matched.
        if technique.nil? && protocol == "ssh" && auth_attempt > 0
          technique = "T1110"
          attack_type = "SSH Brute Force"
          stage = "Credential Access"
          severity = "Medium"
        elsif technique.nil? && protocol == "ftp" && auth_attempt > 0
          technique = "T1110"
          attack_type = "FTP Brute Force"
          stage = "Credential Access"
          severity = "Medium"
        elsif technique.nil? && honeypot == "tanner"
          technique = "T1190"
          attack_type = "HTTP Exploitation"
          stage = "Initial Access"
          severity = "Medium"
        elsif technique.nil? && protocol == "ssh"
          technique = "T1595"
          attack_type = "SSH Connection Probe"
          stage = "Reconnaissance"
          severity = "Low"
        elsif technique.nil? && protocol == "ftp"
          technique = "T1595"
          attack_type = "FTP Connection Probe"
          stage = "Reconnaissance"
          severity = "Low"
        elsif technique.nil? && command_count > 0
          # Count confirms command activity only; it does not reveal command intent.
          technique = "UNKNOWN"
          attack_type = "Command Activity"
          stage = "Execution"
          severity = "Medium"
        end
      end

      # Do not erase an existing classification when no rule matched.
      unless technique.nil?
        n["mitre_technique"] = technique
        n["attack_type"] = attack_type
        n["attack_stage"] = stage
        n["severity"] = severity
        event.set("[norm]", n)
      end
    '
  }


  #
  # FINAL STRICT UNIFIED SCHEMA
  #

  # Exactly 24 top-level fields.
  # No raw.
  # No norm.
  # No geo_city.
  # No geo_asn.
  # No meta.
  #

  ruby {

    id => "strict-unified-24"

    code => '

      n = event.get("[norm]") || {}


      fields = [

        "timestamp",
        "honeypot",
        "protocol",
        "source_ip",
        "source_port",
        "destination_ip",
        "destination_port",
        "session_id",
        "username",
        "password",
        "user_attempt",
        "pass_attempt",
        "auth_attempt",
        "anonymous",
        "command_count",
        "country",
        "country_code",
        "asn",
        "ip_reputation",
        "ip_reputation_score",
        "ip_reputation_level",
        "attack_type",
        "mitre_technique",
        "attack_stage",
        "severity",
        "source_dataset"

      ]


      #
      # REMOVE EVERYTHING
      #


      event.to_hash.keys.each do |key|

        event.remove(key)

      end


      #
      # REMOVE EVERYTHING
      #


      fields.each do |field|

        event.set(field, n[field])

      end

    '

  }


  #
  # FINAL DATA TYPES
  #

  mutate {

    convert => {

      "source_port" => "integer"

      "destination_port" => "integer"

      "user_attempt" => "integer"

      "pass_attempt" => "integer"

      "auth_attempt" => "integer"

      "anonymous" => "integer"

      "command_count" => "integer"

      "asn" => "integer"

      "timestamp" => "string"

    }

  }

  date {
    match => ["timestamp", "ISO8601"]
    target => "@timestamp"
  }

}


output {

  elasticsearch {

    id => "honeypot-events"
    hosts => [ "http://elasticsearch:9200" ]
    index => "honeypot-events"

  }
}
